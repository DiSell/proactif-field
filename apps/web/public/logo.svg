<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#1e40af" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ── Plan (document) ── -->
  <path d="M153,95 L298,95 L343,140 L343,315 Q343,328 330,328 L154,328 Q136,328 136,315 L136,112 Q136,95 153,95 Z"
        fill="white" stroke="#2563eb" stroke-width="6" filter="url(#sh)"/>
  <!-- Coin replié (dog-ear) -->
  <path d="M298,95 L298,140 L343,140 Z" fill="#1d4ed8"/>
  <line x1="298" y1="95" x2="298" y2="140" stroke="#2563eb" stroke-width="3"/>

  <!-- ── Pin (point sur le plan) ── -->
  <path d="M235,230 C200,196 178,170 178,130 C178,96 203,72 235,72 C267,72 292,96 292,130 C292,170 270,196 235,230 Z"
        fill="#2563eb" filter="url(#sh)"/>
  <circle cx="235" cy="130" r="40" fill="white"/>
  <circle cx="235" cy="130" r="16" fill="#f59e0b"/>

  <!-- ── Lignes du plan ── -->
  <g stroke="#ccd8ed" stroke-width="7" stroke-linecap="round">
    <line x1="168" y1="252" x2="292" y2="252"/>
    <line x1="168" y1="272" x2="270" y2="272"/>
    <line x1="168" y1="292" x2="292" y2="292"/>
  </g>

  <!-- ── Badge ✓ ── -->
  <circle cx="318" cy="291" r="37" fill="#f59e0b" filter="url(#sh)"/>
  <path d="M305,291 L315,302 L334,276" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Texte Proactif Field ── -->
  <text x="240" y="420" text-anchor="middle" font-size="60" font-weight="800" letter-spacing="-1">
    <tspan fill="#1b2b4b">Proactif </tspan><tspan fill="#f59e0b">Field</tspan>
  </text>
</svg>
