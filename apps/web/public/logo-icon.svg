  <path d="M142,30 L142,66 L178,66 Z" fill="#1d4ed8"/>
  <line x1="142" y1="30" x2="142" y2="66" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Pin (point sur le plan) -->
  <path d="M104,138 C78,112 62,92 62,68 C62,44 81,26 104,26 C127,26 146,44 146,68 C146,92 130,112 104,138 Z"
        fill="#2563eb" filter="url(#sh)"/>
  <circle cx="104" cy="68" r="28" fill="white"/>
  <circle cx="104" cy="68" r="11" fill="#f59e0b"/>

  <!-- Lignes du plan -->
  <g stroke="#ccd8ed" stroke-width="5" stroke-linecap="round">
    <line x1="52" y1="153" x2="156" y2="153"/>
    <line x1="52" y1="168" x2="136" y2="168"/>
    <line x1="52" y1="183" x2="156" y2="183"/>
    <line x1="52" y1="198" x2="130" y2="198"/>
  </g>

  <!-- Badge ✓ -->
  <circle cx="162" cy="174" r="28" fill="#f59e0b" filter="url(#sh)"/>
  <path d="M151,174 L159,183 L175,161" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
