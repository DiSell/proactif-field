services:
  - type: web
    name: proactif-field-api
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm install && npm run build:shared && npm --workspace=apps/api run prisma:generate && npm --workspace=apps/api run build && npm --workspace=apps/api run prisma:migrate:deploy
    startCommand: npm --workspace=apps/api run start
    disk:
      name: proactif-field-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGIN
        value: https://proactif-field-web.onrender.com,https://field.proactifsystem.com
      - key: WEB_URL
        value: https://field.proactifsystem.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contact@proactifsystem.com

  - type: web
    name: proactif-field-web
    runtime: static
    buildCommand: npm install && npm run build:shared && npm --workspace=apps/web run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://proactif-field-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
